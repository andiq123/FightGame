<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock scale, fill the notch/safe areas (viewport-fit=cover) for a real app feel. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Stick Wars</title>
  <meta name="description" content="Build a stick hero, then watch it defend the base across 20 escalating waves." />
  <meta name="theme-color" content="#0b0e14" />

  <!-- Installable web app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />

  <!-- iOS standalone web-app: full-screen, dark status bar, home-screen title & icon -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stick Wars" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      --accent: #28d6c8;
      /* iOS safe-area insets (notch / home indicator), 0 on devices without them. */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e7edf5;
      /* App-like touch: no pinch-zoom/scroll, no pull-to-refresh, no text selection,
         no tap highlight or long-press callout. */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    /* Use the dynamic viewport units so iOS Safari's toolbar can't crop the canvas. */
    #canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh; }

    /* Top HUD bars */
    #hud { position: fixed; top: 0; left: 0; right: 0;
      padding: calc(14px + var(--sat)) calc(18px + var(--sar)) 14px calc(18px + var(--sal));
      display: flex; gap: 18px; align-items: flex-start; pointer-events: none; z-index: 5; }
    .panel { background: rgba(14,18,26,0.72); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px); min-width: 200px; }
    .panel h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: #93a4ba; font-weight: 700; }
    .bar { height: 14px; border-radius: 7px; background: #1a1f2a; overflow: hidden; position: relative; }
    .bar > span { display: block; height: 100%; width: 100%; border-radius: 7px;
      transition: width .18s ease; }
    .barval { font-size: 12px; color: #aab7c8; margin-top: 4px; font-variant-numeric: tabular-nums; }
    #baseHp { background: linear-gradient(90deg,#2f7fd1,#5cc0ff); }
    #enemyHp { background: linear-gradient(90deg,#b5294a,#ff5d7a); }
    #heroHp { background: linear-gradient(90deg,#17a99c,#4ff0e0); }
    #heroStam { background: linear-gradient(90deg,#caa23a,#ffd66b); transition: width .12s linear, opacity .2s ease; }
    #hpL { background: linear-gradient(90deg,#2f7fd1,#5cc0ff); }
    #hpR { background: linear-gradient(90deg,#b5294a,#ff5d7a); }
    .teamstats { display: flex; gap: 14px; margin-top: 7px; font-size: 13px; color: #aab7c8;
      font-variant-numeric: tabular-nums; }
    .teamstats b { color: #e7edf5; font-weight: 800; }
    .panel.team-l { min-width: 220px; }
    .panel.team-r { min-width: 220px; }
    .aimode { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .mode-def { background: rgba(255,100,80,.18); color: #ff9a88; }
    .mode-build { background: rgba(255,210,90,.15); color: #ffd66b; }
    .mode-push { background: rgba(120,255,160,.12); color: #7dffb0; }
    .mode-grow { background: rgba(120,180,255,.12); color: #8ec5ff; }
    .mode-broke { background: rgba(255,255,255,.08); color: #aab7c8; }
    .mode-full { background: rgba(180,180,200,.1); color: #c8cdd8; }
    .mode-down { background: rgba(0,0,0,.3); color: #666; }
    .aiplan { margin-top: 5px; font-size: 11px; line-height: 1.35; color: #8b9ab0; max-width: 240px; }
    .ailast { margin-top: 4px; font-size: 10px; color: #6a7a90; font-variant-numeric: tabular-nums; }
    .aipicks { margin-top: 3px; font-size: 10px; color: #5cd8ff; font-variant-numeric: tabular-nums; }
    .panel.team-r .aiplan, .panel.team-r .ailast, .panel.team-r .aipicks { margin-left: auto; text-align: right; max-width: 240px; }
    #eventTicker { position: fixed; bottom: calc(14px + var(--sab)); left: 50%; transform: translateX(-50%);
      padding: 6px 16px; border-radius: 999px; background: rgba(10,14,20,.78); border: 1px solid rgba(255,255,255,.08);
      font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #aab7c8; pointer-events: none; z-index: 5;
      backdrop-filter: blur(8px); max-width: min(90vw, 420px); text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }

    .spacer { flex: 1; }
    .stats { display: flex; gap: 22px; justify-content: flex-end; }
    .stat { text-align: center; }
    .stat .n { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8b9ab0; margin-top: 4px; }

    /* Center announcer */
    #announce { position: fixed; top: 30%; left: 50%; transform: translate(-50%,-50%) scale(.9);
      font-size: 64px; font-weight: 900; letter-spacing: .04em; color: #fff;
      text-shadow: 0 4px 30px rgba(40,214,200,.5); opacity: 0; transition: all .35s ease;
      pointer-events: none; z-index: 6; }
    #announce.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    /* Start / end overlay */
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(20,28,40,.86), rgba(8,10,16,.95));
      z-index: 10; }
    #overlay.visible { display: flex; }
    .ov-card { text-align: center; padding: 40px 56px; }
    .ov-title { font-size: 64px; font-weight: 900; margin: 0 0 10px;
      background: linear-gradient(90deg,#28d6c8,#7cf0e4); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; }
    .ov-sub { font-size: 17px; color: #9fb0c4; margin-bottom: 28px; }
    .ov-btn { font: inherit; font-size: 18px; font-weight: 700; color: #06120f; cursor: pointer;
      background: linear-gradient(90deg,#28d6c8,#5cf0e0); border: 0; border-radius: 12px;
      padding: 14px 40px; transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 8px 30px rgba(40,214,200,.35); }
    .ov-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(40,214,200,.5); }

    .ov-card { max-width: 560px; }

    /* Top control row — game speed button in the HUD row. */
    #topControls { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
    .speed-fab { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      white-space: nowrap; background: rgba(14,18,26,.82); color: #e7edf5; border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 10px 15px; font: inherit; font-weight: 800; font-size: 14px;
      cursor: pointer; transition: all .15s ease; min-width: 60px; font-variant-numeric: tabular-nums; }
    .speed-fab:hover { border-color: rgba(40,214,200,.55); background: rgba(40,214,200,.08); }
    .speed-fab.boosted { border-color: #ffd66b; color: #ffe39a; box-shadow: 0 0 0 2px rgba(255,214,107,.22); }

    /* Hide scrollbars (still scrollable by drag/wheel/touch). */
    .ov-card, #overlay { scrollbar-width: none; -ms-overflow-style: none; }
    .ov-card::-webkit-scrollbar, #overlay::-webkit-scrollbar { width: 0; height: 0; display: none; }

    /* ── Touch devices: don't let :hover states stick after a tap ────────────── */
    @media (hover: none) {
      .ov-btn:hover, .shop-item:hover, .chip:hover, .shop-fab:hover, .speed-fab:hover { transform: none; }
    }
    /* Tap controls: instant taps (no 300ms / double-tap-zoom), no stuck callout. */
    .ov-btn, .chip, .shop-item, .shop-fab, .speed-fab, input[type=range] {
      touch-action: manipulation; -webkit-touch-callout: none; }
    /* Finger-sized tap targets */
    @media (pointer: coarse) {
      .shop-item { padding: 14px 16px; }
      .chip { padding: 10px 16px; font-size: 14px; }
      .ld-stat input[type=range] { height: 22px; } /* taller hit area for the thumb */
    }

    /* ── Landscape phones: compact the chrome to fit a short, wide screen ────── */
    @media (max-height: 600px) {
      #hud { gap: 7px; padding: calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(8px + var(--sal)); }
      .panel { padding: 6px 9px; min-width: 0; border-radius: 9px; }
      .panel h3 { font-size: 8px; margin-bottom: 3px; letter-spacing: .08em; }
      .panel h3[style] { margin-top: 6px !important; }
      .bar { height: 8px; border-radius: 5px; }
      .barval { font-size: 9px; margin-top: 2px; }
      .aimode { margin-top: 4px; font-size: 8px; padding: 1px 6px; }
      .aiplan { font-size: 9px; margin-top: 3px; }
      .ailast, .aipicks { font-size: 8px; }
      #eventTicker { font-size: 9px; padding: 4px 10px; bottom: calc(8px + var(--sab)); }
      .stats { gap: 11px; }
      .stat .n { font-size: 16px; }
      .stat .l { font-size: 7px; margin-top: 1px; }
      #skills { gap: 6px; bottom: calc(7px + var(--sab)); }
      .skill { min-width: 46px; height: 32px; border-radius: 9px; }
      .skill .sk-name { font-size: 9px; padding: 0 5px; }
      .skill .sk-timer { font-size: 11px; }
      #announce { font-size: 32px; top: 32%; }
      #topControls { top: calc(7px + var(--sat)); gap: 6px; }
      .shop-fab, .speed-fab { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
      .speed-fab { min-width: 52px; }
      .shop-toast { top: calc(46px + var(--sat)); font-size: 10px; max-width: 220px; padding: 6px 11px; }
      .aegis-pips { font-size: 9px; }
      #overlay { align-items: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .ov-card { padding: calc(12px + var(--sat)) 20px 20px; max-width: 560px; }
      .ov-title { font-size: 32px; margin-bottom: 6px; }
      .ov-sub { font-size: 12px; margin-bottom: 12px; }
      .loadout { padding: 12px 14px; margin: 4px 0 12px; border-radius: 11px; }
      .ld-stats { gap: 12px; margin-bottom: 10px; }
      .ld-lbl { font-size: 12px; }
      .ld-lbl em { font-size: 14px; }
      .ld-hint { font-size: 9px; }
      .ld-group { margin-top: 8px; }
      .ld-group h4 { margin-bottom: 5px; font-size: 9px; }
      .chip { font-size: 11px; padding: 6px 11px; }
      .ov-btn { padding: 11px 26px; font-size: 15px; }
      /* Shop: a slimmer card with tighter rows */
      .shop-card { width: 300px; padding: 14px 16px; border-radius: 14px; }
      .shop-head { margin-bottom: 11px; }
      .shop-title { font-size: 18px; }
      .shop-sub { font-size: 11px; }
      .shop-gold { font-size: 22px; }
      .shop-gold em { font-size: 9px; }
      .shop-items { gap: 6px; margin-bottom: 12px; max-height: none; }
      .shop-item { padding: 9px 12px; border-radius: 10px; }
      .si-name { font-size: 13px; }
      .si-desc { font-size: 11px; }
      .si-cost { font-size: 15px; }
      .shop-hint { font-size: 10px; margin-top: 7px; }
    }
    /* Very small phones — squeeze a touch more */
    @media (max-height: 380px) {
      .panel { padding: 5px 8px; }
      .bar { height: 7px; }
      .stat .n { font-size: 14px; }
      .skill { min-width: 42px; height: 28px; }
      #announce { font-size: 26px; }
    }
    /* Narrow screens — single-column loadout */
    @media (max-width: 760px) { .ld-stats { grid-template-columns: 1fr; } }

    /* ── "Rotate your device" gate (portrait phones only) ───────────────────── */
    #rotate { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
      gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 30px;
      background: #0b0e14; color: #cdd8e6; }
    #rotate .rot-icon { font-size: 54px; animation: rotwig 1.8s ease-in-out infinite; }
    #rotate h2 { margin: 0; font-size: 22px; font-weight: 800; }
    #rotate p { margin: 0; font-size: 14px; color: #8b9ab0; }
    @keyframes rotwig { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(76deg); } }
    @media (orientation: portrait) and (max-width: 920px) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="rotate">
    <div class="rot-icon">📱</div>
    <h2>Rotate your device</h2>
    <p>Stick Wars plays in landscape.</p>
  </div>

  <div id="hud">
    <div class="panel team-l">
      <h3>🔵 Blue Base</h3>
      <div class="bar"><span id="hpL"></span></div>
      <div class="barval"><span id="hpLVal">0</span> HP</div>
      <div class="teamstats">
        <span>⛏ <b id="goldL">0</b></span>
        <span>💀 <b id="killsL">0</b></span>
        <span>⚔ <b id="countL">0</b></span>
      </div>
      <div class="aimode mode-grow" id="modeL">GROW</div>
      <div class="aiplan" id="planL">Evaluating…</div>
      <div class="ailast" id="lastL"></div>
      <div class="aipicks" id="picksL"></div>
    </div>

    <div class="spacer"></div>

    <div id="topControls">
      <button id="speedBtn" class="speed-fab" type="button" aria-label="Game speed">▶ 1×</button>
    </div>

    <div class="spacer"></div>

    <div class="panel team-r" style="text-align:right">
      <h3>🔴 Red Base</h3>
      <div class="bar"><span id="hpR"></span></div>
      <div class="barval"><span id="hpRVal">0</span> HP</div>
      <div class="teamstats" style="justify-content:flex-end">
        <span>⛏ <b id="goldR">0</b></span>
        <span>💀 <b id="killsR">0</b></span>
        <span>⚔ <b id="countR">0</b></span>
      </div>
      <div class="aimode mode-grow" id="modeR">GROW</div>
      <div class="aiplan" id="planR">Evaluating…</div>
      <div class="ailast" id="lastR"></div>
      <div class="aipicks" id="picksR"></div>
    </div>
  </div>

  <div id="eventTicker"></div>

  <div id="announce"></div>

  <div id="overlay">
    <div class="ov-card">
      <h1 class="ov-title">STICK WARS</h1>
      <p class="ov-sub">Two AI bases. Lane gold. Counter-build wars.</p>
      <button class="ov-btn">Start Battle</button>
      <p style="margin-top:20px;font-size:14px"><a href="./pit.html" style="color:#c4a574;text-decoration:none">The Pit — 4v4 colosseum brawl →</a></p>
    </div>
  </div>

  <script type="module" src="./td/main.js"></script>
  <script>
    // Register the service worker (offline + installable). Relative path keeps the
    // scope under /FightGame/ on GitHub Pages and / locally.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    // Kill pinch-zoom on iOS Safari (which ignores user-scalable=no for it). Tap
    // controls use touch-action: manipulation in CSS to drop the double-tap zoom
    // without breaking fast successive taps (e.g. buying several shop items).
    document.addEventListener('gesturestart', (e) => e.preventDefault());
  </script>
</body>
</html>
