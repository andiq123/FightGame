<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick-Man AI Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="game-container">
    <canvas id="canvas"></canvas>
    <header class="hud-top">
      <div class="fighter-hud f1">
        <span class="hud-label">P1 <span class="hud-level" id="hudLevel1">Lvl 1</span></span>
        <div class="bar-wrap">
          <div class="hp-track">
            <div class="hp-fill" id="hp1"></div>
          </div>
          <div class="stamina-track">
            <div class="stamina-fill" id="stam1"></div>
          </div>
        </div>
        <div class="hud-bottom-row f1-row">
          <div class="status-icons" id="statusIcons1"></div>
          <div class="ai-state-tag" id="aiState1"></div>
        </div>
      </div>
      <div class="vs-center">
        <div class="rounds" id="rounds">0 - 0 | R1/3</div>
        <div class="vs">VS</div>
      </div>
      <div class="fighter-hud f2">
        <span class="hud-label">Monster <span class="hud-level" id="hudLevel2">Lvl 1</span></span>
        <div class="bar-wrap">
          <div class="hp-track">
            <div class="hp-fill" id="hp2"></div>
          </div>
          <div class="stamina-track">
            <div class="stamina-fill" id="stam2"></div>
          </div>
        </div>
        <div class="hud-bottom-row f2-row">
          <div class="status-icons" id="statusIcons2"></div>
          <div class="ai-state-tag" id="aiState2"></div>
        </div>
      </div>
    </header>
    <div class="arena-hud">
      <div class="jutsu-hud jutsu-f1">
        <div class="jutsu-slots" id="jutsuSlots1"></div>
      </div>
      <div class="jutsu-feed" id="jutsuFeed"></div>
      <div class="jutsu-hud jutsu-monster">
        <div class="jutsu-slots" id="jutsuSlots2"></div>
      </div>
    </div>
    <div class="match-over" id="matchOver"></div>
    <div class="countdown" id="countdown"></div>

    <div class="quick-controls" id="quickControls">
      <div class="quick-row">
        <button type="button" class="quick-btn stop-btn" id="stopGameBtn">Stop & Reset</button>
      </div>
      <div class="quick-row">
        <span class="quick-label">Speed</span>
        <div class="quick-speed">
          <button type="button" class="quick-speed-btn" data-speed="0.5">0.5x</button>
          <button type="button" class="quick-speed-btn active" data-speed="1">1x</button>
          <button type="button" class="quick-speed-btn" data-speed="2">2x</button>
        </div>
      </div>
      <div class="quick-hint">Esc: Stop</div>
    </div>

    <!-- Hero Customization Screen -->
    <div class="hero-screen" id="heroScreen">
      <div class="hero-screen-inner">
        <div class="hero-panel">
          <h2 class="selection-title">Knight Customization</h2>
          <p class="selection-sub">Configure your hero before entering the fray</p>

          <div class="hero-config-grid">
            <div class="config-section">
              <div class="form-row">
                <label>HP</label>
                <input type="number" id="hpSet1" min="100" max="5000" value="400">
              </div>
              <div class="form-row">
                <label>AI</label>
                <select id="intelligence1">
                  <option value="12">Novice</option>
                  <option value="28">Amateur</option>
                  <option value="48" selected>Competent</option>
                  <option value="68">Skilled</option>
                  <option value="88">Expert</option>
                  <option value="98">Nightmare</option>
                </select>
              </div>
              <div class="form-row">
                <label>Level</label>
                <div class="level-slider-wrap">
                  <input type="range" id="level1" min="1" max="20" value="1">
                  <span class="level-val" id="levelVal1">1</span>
                </div>
              </div>
            </div>

            <div class="config-section">
              <div class="powers">
                <label>Jutsu <span class="power-count">(0/4)</span></label>
                <div class="power-btns" id="powers1"></div>
              </div>
            </div>

          </div>

          <button type="button" class="confirm-btn large-btn" id="confirmHeroBtn">Start Battle</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>

</html>
