<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock scale, fill the notch/safe areas (viewport-fit=cover) for a real app feel. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Stick Defense</title>
  <meta name="description" content="Build a stick hero, then watch it defend the base across 20 escalating waves." />
  <meta name="theme-color" content="#0b0e14" />

  <!-- Installable web app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />

  <!-- iOS standalone web-app: full-screen, dark status bar, home-screen title & icon -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stick Defense" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root {
      --accent: #28d6c8;
      /* iOS safe-area insets (notch / home indicator), 0 on devices without them. */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e7edf5;
      /* App-like touch: no pinch-zoom/scroll, no pull-to-refresh, no text selection,
         no tap highlight or long-press callout. */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    /* Use the dynamic viewport units so iOS Safari's toolbar can't crop the canvas. */
    #canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh; }

    /* Top HUD bars */
    #hud { position: fixed; top: 0; left: 0; right: 0;
      padding: calc(14px + var(--sat)) calc(18px + var(--sar)) 14px calc(18px + var(--sal));
      display: flex; gap: 18px; align-items: flex-start; pointer-events: none; z-index: 5; }
    .panel { background: rgba(14,18,26,0.72); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px); min-width: 200px; }
    .panel h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: #93a4ba; font-weight: 700; }
    .bar { height: 14px; border-radius: 7px; background: #1a1f2a; overflow: hidden; position: relative; }
    .bar > span { display: block; height: 100%; width: 100%; border-radius: 7px;
      transition: width .18s ease; }
    .barval { font-size: 12px; color: #aab7c8; margin-top: 4px; font-variant-numeric: tabular-nums; }
    #baseHp { background: linear-gradient(90deg,#2f7fd1,#5cc0ff); }
    #enemyHp { background: linear-gradient(90deg,#b5294a,#ff5d7a); }
    #heroHp { background: linear-gradient(90deg,#17a99c,#4ff0e0); }
    #heroStam { background: linear-gradient(90deg,#caa23a,#ffd66b); transition: width .12s linear, opacity .2s ease; }
    #hpL { background: linear-gradient(90deg,#2f7fd1,#5cc0ff); }
    #hpR { background: linear-gradient(90deg,#b5294a,#ff5d7a); }
    .teamstats { display: flex; gap: 14px; margin-top: 7px; font-size: 13px; color: #aab7c8;
      font-variant-numeric: tabular-nums; }
    .teamstats b { color: #e7edf5; font-weight: 800; }
    .panel.team-l { min-width: 220px; }
    .panel.team-r { min-width: 220px; }

    .spacer { flex: 1; }
    .stats { display: flex; gap: 22px; justify-content: flex-end; }
    .stat { text-align: center; }
    .stat .n { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #8b9ab0; margin-top: 4px; }

    /* Equipped-skill bar (bottom center) */
    #skills { position: fixed; bottom: calc(18px + var(--sab)); left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 5; pointer-events: none; max-width: 96vw; flex-wrap: wrap;
      justify-content: center; }
    .skill { position: relative; min-width: 74px; height: 46px; border-radius: 11px; overflow: hidden;
      background: rgba(14,18,26,.82); border: 1px solid rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px);
      transition: border-color .15s ease, box-shadow .15s ease; }
    .skill .sk-cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
      background: rgba(8,10,16,.78); transition: height .08s linear; }
    .skill .sk-name { position: relative; font-size: 12px; font-weight: 700; letter-spacing: .02em;
      color: #cdd8e6; padding: 0 10px; transition: opacity .1s ease; }
    .skill .sk-timer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #ffd66b; font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
    .skill.on-cd .sk-name { opacity: .25; }
    .skill.ready { border-color: rgba(40,214,200,.7); box-shadow: 0 0 16px rgba(40,214,200,.28); }
    .skill.ready .sk-name { color: #6ff0e2; }
    .skill.charging { opacity: .9; }

    /* Center wave announcer */
    #announce { position: fixed; top: 30%; left: 50%; transform: translate(-50%,-50%) scale(.9);
      font-size: 64px; font-weight: 900; letter-spacing: .04em; color: #fff;
      text-shadow: 0 4px 30px rgba(40,214,200,.5); opacity: 0; transition: all .35s ease;
      pointer-events: none; z-index: 6; }
    #announce.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    /* Start / end overlay */
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(20,28,40,.86), rgba(8,10,16,.95));
      z-index: 10; }
    #overlay.visible { display: flex; }
    .ov-card { text-align: center; padding: 40px 56px; }
    .ov-title { font-size: 64px; font-weight: 900; margin: 0 0 10px;
      background: linear-gradient(90deg,#28d6c8,#7cf0e4); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; }
    .ov-sub { font-size: 17px; color: #9fb0c4; margin-bottom: 28px; }
    .ov-btn { font: inherit; font-size: 18px; font-weight: 700; color: #06120f; cursor: pointer;
      background: linear-gradient(90deg,#28d6c8,#5cf0e0); border: 0; border-radius: 12px;
      padding: 14px 40px; transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 8px 30px rgba(40,214,200,.35); }
    .ov-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(40,214,200,.5); }

    /* Loadout chooser */
    .ov-card { max-width: 720px; }
    .loadout { text-align: left; margin: 8px 0 30px;
      background: rgba(10,14,20,.55); border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px; padding: 22px 26px; }
    .ld-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 20px; }
    .ld-stat { display: flex; flex-direction: column; gap: 7px; }
    .ld-lbl { font-size: 14px; font-weight: 700; color: #d6e0ee; letter-spacing: .02em; }
    .ld-lbl em { color: #28d6c8; font-style: normal; font-size: 17px; margin-left: 4px; }
    .ld-hint { font-size: 11px; color: #76859a; }
    .ld-stat input[type=range] { width: 100%; accent-color: #28d6c8; cursor: pointer; height: 4px; }
    .ld-group { margin-top: 16px; }
    .ld-group h4 { margin: 0 0 9px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: #93a4ba; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      color: #aeb9c8; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px; padding: 7px 14px; transition: all .12s ease; }
    .chip:hover { border-color: rgba(40,214,200,.5); color: #dfe7f0; }
    .chip.on { color: #06120f; background: linear-gradient(90deg,#28d6c8,#5cf0e0);
      border-color: transparent; box-shadow: 0 4px 14px rgba(40,214,200,.35); }

    /* Between-wave shop */
    /* Optional, non-pausing panel: floats on the right, game stays visible &
       playable behind it (no full-screen backdrop, no pointer capture). */
    #shop { position: fixed; top: 0; right: 0; bottom: 0; display: none;
      align-items: center; justify-content: flex-end; z-index: 11; pointer-events: none;
      padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) 16px; }
    #shop.visible { display: flex; }
    .shop-card { pointer-events: auto; width: 380px; max-width: 92vw; max-height: 100%;
      overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
      overscroll-behavior: contain; background: rgba(14,18,26,.92); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    .shop-actions { display: flex; gap: 10px; }
    .shop-actions .ov-btn { flex: 1; }
    .ov-btn.ghost { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #e7edf5; }
    .ov-btn.ghost:hover { border-color: rgba(40,214,200,.55); }
    .ov-btn.ghost.active { background: rgba(40,214,200,.16); border-color: rgba(40,214,200,.6); color: #bdf6ef; }
    .shop-hint { margin: 10px 2px 0; font-size: 11.5px; color: #8b9ab0; text-align: center; }

    /* Top control row — Upgrades + game speed, sitting in the HUD row (centred
       between the keep panel and the stats), so it never overlaps them. */
    #topControls { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
    .shop-fab, .speed-fab { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      white-space: nowrap; background: rgba(14,18,26,.82); color: #e7edf5; border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 10px 15px; font: inherit; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all .15s ease; }
    .speed-fab { min-width: 60px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .shop-fab:hover, .speed-fab:hover { border-color: rgba(40,214,200,.55); background: rgba(40,214,200,.08); }
    .speed-fab.boosted { border-color: #ffd66b; color: #ffe39a; box-shadow: 0 0 0 2px rgba(255,214,107,.22); }
    .shop-dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
    .shop-fab.has-deals { border-color: #ffd66b; box-shadow: 0 0 0 2px rgba(255,214,107,.22); }
    .shop-fab.has-deals .shop-dot { background: #ffd66b; box-shadow: 0 0 8px #ffd66b; }
    .shop-toast { position: fixed; top: calc(56px + var(--sat)); left: 50%; transform: translateX(-50%);
      z-index: 10; max-width: 280px; text-align: center; padding: 8px 14px; border-radius: 10px; font-size: 12.5px;
      color: #ffe39a; background: rgba(255,214,107,.12); border: 1px solid rgba(255,214,107,.4);
      opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .shop-toast.show { opacity: 1; }
    .shop-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
    .shop-title { margin: 0; font-size: 26px; font-weight: 800; }
    .shop-title span { color: #28d6c8; }
    .shop-sub { margin: 4px 0 0; font-size: 13px; color: #93a4ba; }
    .shop-gold { font-size: 30px; font-weight: 900; color: #ffd66b; text-align: right; white-space: nowrap;
      font-variant-numeric: tabular-nums; }
    .shop-gold em { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: #8b9ab0; font-style: normal; font-weight: 700; }
    .shop-items { display: flex; flex-direction: column; gap: 9px; margin-bottom: 22px; max-height: 50vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
    .shop-item { display: flex; align-items: center; justify-content: space-between; gap: 14px;
      text-align: left; font: inherit; cursor: pointer; color: #e7edf5;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
      padding: 12px 16px; transition: all .12s ease; }
    .shop-item:hover:not(.disabled) { border-color: rgba(40,214,200,.55); background: rgba(40,214,200,.08); transform: translateY(-1px); }
    .shop-item.disabled { opacity: .4; cursor: not-allowed; }
    .si-name { font-size: 15px; font-weight: 700; }
    .si-desc { font-size: 12px; color: #93a4ba; margin-top: 2px; }
    .si-cost { font-size: 18px; font-weight: 800; color: #ffd66b; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .si-cost span { font-size: 12px; color: #b89a4d; margin-left: 1px; }
    /* Aegis barrier charge pips beside the base title (subtle, in-the-know). */
    .aegis-pips { float: right; letter-spacing: 1px; font-size: 11px; line-height: 1; }
    .aegis-pips .pip { color: #78e1ff; text-shadow: 0 0 6px rgba(120,225,255,.6); }
    .aegis-pips .pip.spent { color: rgba(255,255,255,.18); text-shadow: none; }

    /* Hide scrollbars everywhere (still scrollable by drag/wheel/touch). */
    .shop-items, .shop-card, .ov-card, #overlay { scrollbar-width: none; -ms-overflow-style: none; }
    .shop-items::-webkit-scrollbar, .shop-card::-webkit-scrollbar,
    .ov-card::-webkit-scrollbar, #overlay::-webkit-scrollbar { width: 0; height: 0; display: none; }

    /* ── Touch devices: don't let :hover states stick after a tap ────────────── */
    @media (hover: none) {
      .ov-btn:hover, .shop-item:hover, .chip:hover, .shop-fab:hover, .speed-fab:hover { transform: none; }
    }
    /* Tap controls: instant taps (no 300ms / double-tap-zoom), no stuck callout. */
    .ov-btn, .chip, .shop-item, .shop-fab, .speed-fab, input[type=range] {
      touch-action: manipulation; -webkit-touch-callout: none; }
    /* Finger-sized tap targets */
    @media (pointer: coarse) {
      .shop-item { padding: 14px 16px; }
      .chip { padding: 10px 16px; font-size: 14px; }
      .ld-stat input[type=range] { height: 22px; } /* taller hit area for the thumb */
    }

    /* ── Landscape phones: compact the chrome to fit a short, wide screen ────── */
    @media (max-height: 600px) {
      #hud { gap: 7px; padding: calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(8px + var(--sal)); }
      .panel { padding: 6px 9px; min-width: 0; border-radius: 9px; }
      .panel h3 { font-size: 8px; margin-bottom: 3px; letter-spacing: .08em; }
      .panel h3[style] { margin-top: 6px !important; }
      .bar { height: 8px; border-radius: 5px; }
      .barval { font-size: 9px; margin-top: 2px; }
      .stats { gap: 11px; }
      .stat .n { font-size: 16px; }
      .stat .l { font-size: 7px; margin-top: 1px; }
      #skills { gap: 6px; bottom: calc(7px + var(--sab)); }
      .skill { min-width: 46px; height: 32px; border-radius: 9px; }
      .skill .sk-name { font-size: 9px; padding: 0 5px; }
      .skill .sk-timer { font-size: 11px; }
      #announce { font-size: 32px; top: 32%; }
      #topControls { top: calc(7px + var(--sat)); gap: 6px; }
      .shop-fab, .speed-fab { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
      .speed-fab { min-width: 52px; }
      .shop-toast { top: calc(46px + var(--sat)); font-size: 10px; max-width: 220px; padding: 6px 11px; }
      .aegis-pips { font-size: 9px; }
      #overlay { align-items: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .ov-card { padding: calc(12px + var(--sat)) 20px 20px; max-width: 560px; }
      .ov-title { font-size: 32px; margin-bottom: 6px; }
      .ov-sub { font-size: 12px; margin-bottom: 12px; }
      .loadout { padding: 12px 14px; margin: 4px 0 12px; border-radius: 11px; }
      .ld-stats { gap: 12px; margin-bottom: 10px; }
      .ld-lbl { font-size: 12px; }
      .ld-lbl em { font-size: 14px; }
      .ld-hint { font-size: 9px; }
      .ld-group { margin-top: 8px; }
      .ld-group h4 { margin-bottom: 5px; font-size: 9px; }
      .chip { font-size: 11px; padding: 6px 11px; }
      .ov-btn { padding: 11px 26px; font-size: 15px; }
      /* Shop: a slimmer card with tighter rows */
      .shop-card { width: 300px; padding: 14px 16px; border-radius: 14px; }
      .shop-head { margin-bottom: 11px; }
      .shop-title { font-size: 18px; }
      .shop-sub { font-size: 11px; }
      .shop-gold { font-size: 22px; }
      .shop-gold em { font-size: 9px; }
      .shop-items { gap: 6px; margin-bottom: 12px; max-height: none; }
      .shop-item { padding: 9px 12px; border-radius: 10px; }
      .si-name { font-size: 13px; }
      .si-desc { font-size: 11px; }
      .si-cost { font-size: 15px; }
      .shop-hint { font-size: 10px; margin-top: 7px; }
    }
    /* Very small phones — squeeze a touch more */
    @media (max-height: 380px) {
      .panel { padding: 5px 8px; }
      .bar { height: 7px; }
      .stat .n { font-size: 14px; }
      .skill { min-width: 42px; height: 28px; }
      #announce { font-size: 26px; }
    }
    /* Narrow screens — single-column loadout */
    @media (max-width: 760px) { .ld-stats { grid-template-columns: 1fr; } }

    /* ── "Rotate your device" gate (portrait phones only) ───────────────────── */
    #rotate { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
      gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 30px;
      background: #0b0e14; color: #cdd8e6; }
    #rotate .rot-icon { font-size: 54px; animation: rotwig 1.8s ease-in-out infinite; }
    #rotate h2 { margin: 0; font-size: 22px; font-weight: 800; }
    #rotate p { margin: 0; font-size: 14px; color: #8b9ab0; }
    @keyframes rotwig { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(76deg); } }
    @media (orientation: portrait) and (max-width: 920px) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="rotate">
    <div class="rot-icon">📱</div>
    <h2>Rotate your device</h2>
    <p>Stick Defense plays in landscape.</p>
  </div>

  <div id="hud">
    <div class="panel team-l">
      <h3>🔵 Blue Base</h3>
      <div class="bar"><span id="hpL"></span></div>
      <div class="barval"><span id="hpLVal">0</span> HP</div>
      <div class="teamstats">
        <span>⛏ <b id="goldL">0</b></span>
        <span>💀 <b id="killsL">0</b></span>
        <span>⚔ <b id="countL">0</b></span>
      </div>
    </div>

    <div class="spacer"></div>

    <div id="topControls">
      <button id="speedBtn" class="speed-fab" type="button" aria-label="Game speed">▶ 1×</button>
    </div>

    <div class="spacer"></div>

    <div class="panel team-r" style="text-align:right">
      <h3>🔴 Red Base</h3>
      <div class="bar"><span id="hpR"></span></div>
      <div class="barval"><span id="hpRVal">0</span> HP</div>
      <div class="teamstats" style="justify-content:flex-end">
        <span>⛏ <b id="goldR">0</b></span>
        <span>💀 <b id="killsR">0</b></span>
        <span>⚔ <b id="countR">0</b></span>
      </div>
    </div>
  </div>

  <div id="announce"></div>

  <div id="overlay">
    <div class="ov-card">
      <h1 class="ov-title">STICK WARS</h1>
      <p class="ov-sub">Two AI bases. Endless gold. Watch them fight.</p>
      <button class="ov-btn">Start Battle</button>
    </div>
  </div>

  <script type="module" src="./td/main.js"></script>
  <script>
    // Register the service worker (offline + installable). Relative path keeps the
    // scope under /FightGame/ on GitHub Pages and / locally.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    // Kill pinch-zoom on iOS Safari (which ignores user-scalable=no for it). Tap
    // controls use touch-action: manipulation in CSS to drop the double-tap zoom
    // without breaking fast successive taps (e.g. buying several shop items).
    document.addEventListener('gesturestart', (e) => e.preventDefault());
  </script>
</body>
</html>
